name: Build Windows app

# Builds and tests the Windows desktop executable on every push to main, and
# stores it as a (private, repo-scoped) workflow artifact.
#
# IMPORTANT: publishing the unsigned .exe to a PUBLIC GitHub Release has been
# DISABLED. Unsigned PyInstaller one-file executables are a common false
# positive for automated malware scanners, which can lead to the asset being
# flagged or the account being actioned. Until the executable is code-signed,
# we only keep it as a workflow artifact (downloadable by the repo owner from
# the Actions run, not exposed as a public download).
#
# To re-enable a public download later (ideally only once the .exe is signed),
# restore the "Publish ... release" steps at the bottom of this file and set
# `permissions: contents: write`.
#
# RUNNER CHOICE
# -------------
# This uses GitHub's hosted Windows runner (runs-on: windows-latest), which
# needs no setup. To build on your OWN machine ("local" / self-hosted runner),
# register a runner (repo Settings -> Actions -> Runners -> New self-hosted
# runner) and change `runs-on: windows-latest` to `runs-on: [self-hosted, windows]`.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt
          pip install pytest

      - name: Run tests
        run: python -m pytest -q

      - name: Build the executable
        run: python -m PyInstaller --noconfirm --clean DSIP_Downloader.spec

      - name: Smoke-test the executable (best effort)
        continue-on-error: true
        run: |
          .\dist\DSIP_Downloader.exe --selftest
          if (Test-Path "$env:TEMP\dsip_selftest_ok.txt") {
            Write-Host "Self-test OK"
          } else {
            Write-Host "Self-test sentinel not found (no desktop session?)"
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSIP_Downloader-windows
          path: dist/DSIP_Downloader.exe
          if-no-files-found: error

      # ---------------------------------------------------------------------
      # DISABLED: public release publishing. See the note at the top of this
      # file. Do not re-enable until the executable is code-signed. Restoring
      # these also requires `permissions: contents: write` above.
