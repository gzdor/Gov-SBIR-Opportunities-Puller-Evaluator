      #   with:
      #     tag_name: latest
      #     name: Latest Windows build
      #     prerelease: false
      #     files: dist/DSIP_Downloader.exe
      #
      # - name: Publish tagged release
      #   if: startsWith(github.ref, 'refs/tags/v')
      #   uses: softprops/action-gh-release@v2
